site_name: VSlices
site_description: A progressive software engineering suite specialized in preserving continuity
site_author: VSlices
site_url: https://vslices.readthedocs.io/en/latest/

repo_url: https://github.com/vslices/docs
repo_name: vslices/docs

extra:
    social_card_image: https://raw.githubusercontent.com/vslices/icons/refs/heads/main/social/social-card-en.png

docs_dir: docs/en

theme:
    name: material
    logo: https://raw.githubusercontent.com/vslices/icons/refs/heads/main/official/icon.svg
    favicon: https://raw.githubusercontent.com/vslices/icons/refs/heads/main/favicons/favicon.ico
    language: en
    features:
        - navigation.tracking
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.path
        - navigation.top
        - navigation.footer
        - search.suggest
        - search.highlight
        - search.share
        
    palette:
        # Palette toggle for automatic mode
        - media: "(prefers-color-scheme)"
          toggle:
            icon: material/brightness-auto
            name: Switch to light mode

        # Palette toggle for light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: deep purple
          accent: purple
          toggle:
            icon: material/brightness-7
            name: Switch to dark mode

        # Palette toggle for dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: indigo
          accent: indigo
          toggle:
            icon: material/brightness-4
            name: Switch to system preference

plugins: 
    - search:
        lang: en
    - mermaid2:
        version: 10.0.2
        arguments:
            theme: base
            themeVariables:
                background: transparent
                primaryColor: "#eef2ff"
                primaryTextColor: "#1f2937"
                primaryBorderColor: "#8b5cf6"
                lineColor: "#8b5cf6"
                secondaryColor: "#ede9fe"
                tertiaryColor: "#ffffff"
                clusterBkg: "#fefce8"
                clusterBorder: "#c4b454"
                edgeLabelBackground: "#ffffff"

    - include-markdown
    - social:
        enabled: !ENV [CI, false]

markdown_extensions:
    - admonition
    - attr_list
    - md_in_html
    - pymdownx.tabbed:
        alternate_style: true

extra_css:
    - stylesheets/base.css
    - stylesheets/admonition.experimental.css
    - stylesheets/admonition.principle.css
    - stylesheets/admonition.reading.css
    - stylesheets/admonition.risk.css
    - stylesheets/mermaid.css
    - stylesheets/hero.css

